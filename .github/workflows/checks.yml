name: Checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plugin structure, skills and scripts
        run: python3 scripts/check_plugin.py

      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            pattern='^((release|hotfix)/|develop$)'
          else
            pattern='^(feat|fix|docs|chore|refactor|test|ci|perf|dependabot)/'
          fi
          if ! echo "$HEAD_REF" | grep -Eq "$pattern"; then
            echo "::error::Branch '$HEAD_REF' does not match $pattern for a pull request into $BASE_REF."
            exit 1
          fi

      - name: Pull request size
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          stats=$(git diff --numstat "origin/$BASE_REF...HEAD" -- . ':(exclude)evals/*/files/**' ':(exclude)LICENSE')
          files=$(printf '%s\n' "$stats" | grep -c . || true)
          lines=$(printf '%s\n' "$stats" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Changed: $files files, $lines lines (eval fixtures and LICENSE excluded)."
          if [ "$files" -gt 20 ] || [ "$lines" -gt 1500 ]; then
            echo "::warning::Above the size ceiling (20 files or 1500 lines). Split the pull request or explain why in its Why section."
          fi
