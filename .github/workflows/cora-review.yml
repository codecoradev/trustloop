name: Cora Review

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: cora-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require review secrets
        env:
          CORA_API_KEY: ${{ secrets.CORA_API_KEY }}
        run: |
          if [ -z "$CORA_API_KEY" ]; then
            echo "::error::CORA_API_KEY is not set for this repository; the review cannot run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: codecoradev/cora-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cora-api-key: ${{ secrets.CORA_API_KEY }}
          cora-base-url: ${{ secrets.CORA_BASE_URL }}
          cora-model: ${{ secrets.CORA_MODEL }}
          base-branch: origin/${{ github.base_ref }}
